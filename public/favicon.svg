<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Space background -->
  <circle cx="16" cy="16" r="16" fill="#0a0e1a"/>
  <!-- Earth globe -->
  <circle cx="16" cy="16" r="10" fill="#1a3a5c"/>
  <!-- Ocean/land patches -->
  <path d="M10 11 Q13 8 16 10 Q19 8 22 11 Q24 14 22 18 Q19 22 16 22 Q13 22 10 18 Q8 14 10 11Z" fill="#1e5fa8"/>
  <path d="M13 9 Q15 7 17 9 L18 13 Q16 15 14 13Z" fill="#2d8a4e"/>
  <path d="M18 14 Q21 13 22 16 Q21 19 18 19 Q17 17 18 14Z" fill="#2d8a4e"/>
  <path d="M10 15 Q12 14 13 17 Q11 19 10 17Z" fill="#2d8a4e"/>
  <path d="M14 19 Q16 18 18 19 Q17 21 15 21Z" fill="#2d8a4e"/>
  <!-- Atmosphere glow -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
  <!-- Orbital ring (represents Moon/Mars missions) -->
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.7" transform="rotate(-25 16 16)"/>
  <!-- Small dot = spacecraft/moon -->
  <circle cx="27" cy="12" r="1.2" fill="#38bdf8" opacity="0.9"/>
</svg>
